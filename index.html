<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel 25 Puntos — Leyva Asesores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF6EF; --card:#FFFDF8; --ink:#2A2118; --ink-2:#6B5D4D; --ink-3:#A6987F;
  --line:#E8DFCE; --amber:#B45309; --amber-soft:#F5E3C8; --red:#B91C1C;
  --good:#2E7D32; --good-soft:#E3EFE1; --warn:#B45309; --warn-soft:#F5E3C8;
  --bad:#B91C1C; --bad-soft:#F6E0DC; --gray-soft:#EFEAE0;
  --radius:16px; --shadow:0 1px 2px rgba(42,33,24,.06),0 8px 24px -12px rgba(42,33,24,.18);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:'Sora',system-ui,sans-serif;background:var(--paper);color:var(--ink);
  background-image:radial-gradient(circle at 15% -5%,rgba(180,83,9,.05),transparent 45%),
  radial-gradient(circle at 90% 5%,rgba(185,28,28,.04),transparent 40%);min-height:100vh}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px 96px}
@media(min-width:900px){.wrap{padding:0 32px 96px}}

/* ===== header ===== */
header{display:flex;align-items:center;justify-content:space-between;padding:20px 0 4px;gap:12px;flex-wrap:wrap}
.brand{font-family:'Fraunces',serif;font-weight:900;font-size:22px;letter-spacing:-.02em}
.brand em{font-style:normal;color:var(--amber)}
.brand small{display:block;font-family:'Sora';font-weight:600;font-size:10px;letter-spacing:.18em;color:var(--ink-3);text-transform:uppercase}
.hdr-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.today-pill{background:var(--card);border:1.5px solid var(--line);border-radius:99px;padding:8px 16px;
  font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow)}
.today-pill .dot{width:8px;height:8px;border-radius:50%;background:var(--amber);animation:pulse 2.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.today-pill small{color:var(--ink-3);font-weight:600}
.logout-btn{border:1.5px solid var(--line);background:var(--card);font-family:'Sora';font-weight:700;font-size:12px;
  padding:8px 14px;border-radius:99px;color:var(--ink-2);cursor:pointer}
.logout-btn:hover{border-color:var(--amber);color:var(--amber)}

/* ===== login ===== */
.login-wrap{min-height:60vh;display:flex;align-items:center;justify-content:center;padding:24px 0}
.login-card{width:100%;max-width:340px;padding:28px 26px;display:flex;flex-direction:column;gap:14px}
.login-card h2{margin:0 0 2px}
.login-card label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:var(--ink-2)}
.login-card input{font:inherit;font-size:15px;padding:11px 13px;border-radius:10px;border:1.5px solid var(--line);
  background:var(--paper);color:var(--ink);outline:none}
.login-card input:focus{border-color:var(--amber)}
.login-card button{margin-top:6px;border:0;background:var(--ink);color:var(--paper);font-family:'Sora';font-weight:700;
  font-size:14px;padding:12px;border-radius:10px;cursor:pointer}
.login-err{color:var(--bad);font-size:12px;font-weight:700;margin:-4px 0 0}

/* ===== agent chips ===== */
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--card);
  border-radius:99px;padding:7px 14px 7px 7px;font:inherit;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;transition:all .15s}
.chip .av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff}
.chip.on{border-color:var(--ink);color:var(--ink);box-shadow:var(--shadow)}

/* ===== hero ===== */
.hero{background:var(--ink);color:var(--paper);border-radius:24px;padding:26px 24px 24px;margin-top:14px;
  position:relative;overflow:hidden;box-shadow:0 16px 40px -16px rgba(42,33,24,.45)}
.hero::after{content:"";position:absolute;inset:0;background:
  radial-gradient(circle at 85% 15%,rgba(217,119,6,.35),transparent 55%);pointer-events:none}
@media(min-width:900px){.hero{padding:34px 36px 30px}}
.hero .date{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#C9BBA4;font-weight:600}
.hero-row{display:flex;align-items:flex-end;gap:20px;margin-top:10px;position:relative;z-index:1;flex-wrap:wrap}
.big-pts{font-family:'Fraunces',serif;font-weight:900;font-size:88px;line-height:.85;letter-spacing:-.03em}
@media(min-width:900px){.big-pts{font-size:108px}}
.big-pts span{font-size:26px;font-weight:700;color:#C9BBA4;letter-spacing:0}
.hero-msg{font-size:14px;line-height:1.45;color:#E8DFCE;padding-bottom:8px;max-width:420px}
.hero-msg b{color:#F5C36B}
.track{height:12px;background:rgba(255,255,255,.14);border-radius:99px;margin-top:18px;position:relative;z-index:1}
.track .fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#D97706,#F5C36B);
  transition:width .6s cubic-bezier(.22,1,.36,1);min-width:12px}
.track .fill.done{background:linear-gradient(90deg,#4C9A50,#7FC183)}
.track-lbl{display:flex;justify-content:space-between;font-size:11px;color:#C9BBA4;margin-top:8px;font-weight:600;position:relative;z-index:1}
.badge-done{display:inline-flex;align-items:center;gap:6px;background:rgba(76,154,80,.25);color:#A8D8AB;
  font-size:12px;font-weight:700;padding:5px 12px;border-radius:99px;margin-top:12px;position:relative;z-index:1}
.badge-done.hidden{display:none}

/* ===== layout desktop ===== */
.grid-2{display:grid;grid-template-columns:1fr;gap:0 28px}
@media(min-width:900px){.grid-2{grid-template-columns:1fr 1fr}}
.grid-2 > div{min-width:0}

/* ===== sections ===== */
h2{font-family:'Fraunces',serif;font-weight:700;font-size:19px;margin:30px 0 12px;letter-spacing:-.01em}
h2 small{font-family:'Sora';font-weight:600;font-size:11px;color:var(--ink-3);letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}

/* ===== counters ===== */
.counters{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:560px){.counters{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.counters{grid-template-columns:repeat(5,1fr)}}
.counter{padding:14px;display:flex;flex-direction:column;gap:10px}
.counter .lbl{font-size:12px;font-weight:600;color:var(--ink-2);line-height:1.25;min-height:2.5em}
.counter .lbl b{display:inline-block;background:var(--amber-soft);color:var(--amber);font-size:10px;font-weight:800;
  padding:2px 7px;border-radius:99px;margin-left:2px;white-space:nowrap}
.ctr-row{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.ctr-row .val{font-family:'Fraunces',serif;font-weight:900;font-size:30px;line-height:1}
.ctr-earn{font-size:11px;font-weight:800;color:var(--amber)}
.ctr-btns{display:flex;gap:8px;margin-top:auto}
.ctr-btn{height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--paper);
  font-size:22px;font-weight:700;color:var(--ink);cursor:pointer;transition:all .1s;line-height:1}
.ctr-btn[data-d="-1"]{flex:0 0 46px}
.ctr-btn[data-d="1"]{flex:1;background:var(--ink);border-color:var(--ink);color:var(--paper);font-size:24px}
.ctr-btn:active{transform:scale(.94);background:var(--amber);border-color:var(--amber);color:var(--paper)}
.counter.money .ctr-row input{font-family:'Fraunces',serif;font-weight:900;font-size:24px;width:100%;border:0;
  background:transparent;color:var(--ink);text-align:center;outline:none}

/* ===== bloque de seguimiento (no suma puntos), plegado por defecto ===== */
.extra{margin-top:6px}
.extra>summary{cursor:pointer;list-style:none;font-size:12px;font-weight:800;color:var(--ink-3);
  text-transform:uppercase;letter-spacing:.06em;padding:12px 2px;display:flex;align-items:center;gap:8px}
.extra>summary::-webkit-details-marker{display:none}
.extra>summary::before{content:"▸";font-size:11px;transition:transform .15s}
.extra[open]>summary::before{transform:rotate(90deg)}
.extra .counters{margin-bottom:6px}
/* ===== pestañas del agente ===== */
.tabs{display:flex;gap:6px;margin:14px 0 2px;border-bottom:1.5px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:0;background:transparent;font:inherit;font-weight:700;font-size:14px;color:var(--ink-3);
  padding:10px 14px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1.5px}
.tab:hover{color:var(--ink-2)}
.tab.on{color:var(--ink);border-bottom-color:var(--amber)}

/* ===== barra de día que se captura ===== */
.dia-bar{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.dia-bar label{display:flex;flex-direction:column;gap:5px;font-size:11px;font-weight:700;
  color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.dia-bar input{font:inherit;font-size:14px;font-weight:600;padding:9px 12px;border-radius:10px;
  border:1.5px solid var(--line);background:var(--card);color:var(--ink);outline:none}
.dia-bar input:focus{border-color:var(--amber)}
.dia-hoy{border:1.5px solid var(--line);background:var(--card);font:inherit;font-weight:700;font-size:12px;
  padding:9px 14px;border-radius:10px;color:var(--ink-2);cursor:pointer}
.dia-hoy:hover{border-color:var(--amber);color:var(--amber)}
.dia-sello{font-size:11.5px;font-weight:700;color:var(--warn);background:var(--warn-soft);
  padding:7px 12px;border-radius:99px}
/* celda del heatmap capturada en retroactivo */
.heat td.late::after{content:"✎";position:absolute;top:-2px;right:1px;font-size:9px;color:var(--warn)}
.heat td{position:relative}

/* ===== avatar con foto ===== */
.av.foto,.av-xl.foto{background-size:cover;background-position:center;color:transparent;font-size:0}
.av-xl{width:86px;height:86px;border-radius:50%;display:grid;place-items:center;
  font-size:26px;font-weight:800;color:#fff;flex:0 0 auto;font-family:'Fraunces',serif}

/* ===== perfil ===== */
.perfil{padding:20px;display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
.pf-foto{display:flex;flex-direction:column;align-items:center;gap:8px}
.pf-subir{font-size:12px;font-weight:700;color:var(--amber);cursor:pointer}
.pf-quitar{border:0;background:transparent;font:inherit;font-size:11px;font-weight:600;color:var(--ink-3);cursor:pointer}
.pf-quitar:hover{color:var(--bad)}
.pf-datos{flex:1;min-width:220px;display:flex;flex-direction:column;gap:12px}
.pf-nombre{font-family:'Fraunces',serif;font-weight:900;font-size:22px}
.perfil label,.meta-card label,.pf-pass label{display:flex;flex-direction:column;gap:5px;
  font-size:12px;font-weight:700;color:var(--ink-2)}
.perfil input,.meta-card input,.pf-pass input{font:inherit;font-size:15px;padding:10px 12px;border-radius:10px;
  border:1.5px solid var(--line);background:var(--paper);color:var(--ink);outline:none;width:100%}
.perfil input:focus,.meta-card input:focus,.pf-pass input:focus{border-color:var(--amber)}
.meta-card{padding:18px;margin-bottom:10px}
.meta-prog{height:10px;background:var(--gray-soft);border-radius:99px;margin-top:14px;overflow:hidden}
.meta-prog .fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#D97706,#F5C36B);transition:width .5s}
.meta-prog .fill.done{background:linear-gradient(90deg,#4C9A50,#7FC183)}
.meta-lbl{font-size:12px;font-weight:700;color:var(--ink-2);margin-top:8px;display:flex;justify-content:space-between;gap:8px}
.meta-lbl .ok{color:var(--good)}
.meta-vacia{font-size:12.5px;color:var(--ink-3);font-weight:600;margin-top:12px}
.pf-pass{padding:18px;display:flex;flex-direction:column;gap:12px}
.pf-pass button{border:0;background:var(--ink);color:var(--paper);font:inherit;font-weight:700;
  font-size:14px;padding:12px;border-radius:10px;cursor:pointer}
.pf-msg{font-size:12px;font-weight:700;margin:-4px 0 0}
.pf-msg.ok{color:var(--good)}
.pf-msg.err{color:var(--bad)}

/* ===== referidos ===== */
.ref-row{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.ref-row input[data-rf="nombre"]{grid-column:1/-1}
.ref-row input,.ref-row select{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;
  padding:9px 10px;background:var(--paper);color:var(--ink);width:100%;outline:none}
.ref-row input:focus,.ref-row select:focus{border-color:var(--amber)}
.ref-row .rm{justify-self:end;align-self:center;border:0;background:transparent;color:var(--ink-3);
  font-size:18px;cursor:pointer;padding:4px 8px}
.ref-row .rm:hover{color:var(--bad)}
.ref-head{display:none}
@media(min-width:860px){
  .ref-row{grid-template-columns:1.3fr 1.1fr 1.1fr .9fr 1fr 28px;align-items:center;padding:10px 18px}
  .ref-row input[data-rf="nombre"]{grid-column:auto}
  .ref-row input,.ref-row select{font-size:12.5px;padding:7px 8px}
  .ref-row .rm{justify-self:auto;font-size:16px}
  .ref-head{display:grid;grid-template-columns:1.3fr 1.1fr 1.1fr .9fr 1fr 28px;gap:10px;padding:14px 18px 8px;
    font-size:10px;font-weight:800;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
}

/* ===== áreas de mejora (vista dueña) ===== */
.mejoras{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:760px){.mejoras{grid-template-columns:1fr 1fr}}
.mejora{padding:16px 18px}
.mejora .mh{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.mejora .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  font-size:12px;font-weight:800;color:#fff;flex:0 0 auto}
.mejora .nm{font-size:14px;font-weight:700}
.mejora .area{font-size:11px;font-weight:800;color:var(--amber);text-transform:uppercase;letter-spacing:.06em}
.mejora.ok .area{color:var(--good)}
.mejora.nuevo .area{color:var(--ink-3)}
.mejora.nuevo .tip{border-left-color:var(--gray-soft)}
.mejora .dato{font-size:13px;color:var(--ink-2);font-weight:600;line-height:1.45}
.mejora .dato .vs{color:var(--ink-3)}
.mejora .tip{font-size:12.5px;line-height:1.5;color:var(--ink);margin-top:8px;
  border-left:3px solid var(--amber-soft);padding-left:10px}
.mejora.ok .tip{border-left-color:var(--good-soft)}

/* ===== tour guiado (spotlight) ===== */
#tour{position:fixed;inset:0;z-index:60;pointer-events:none}
#tour[hidden]{display:none}
#tourHole{position:absolute;border-radius:18px;pointer-events:none;
  box-shadow:0 0 0 9999px rgba(42,33,24,.74),0 0 0 3px var(--amber) inset;
  transition:top .3s cubic-bezier(.22,1,.36,1),left .3s cubic-bezier(.22,1,.36,1),width .3s,height .3s}
#tourBox{position:absolute;width:min(340px,calc(100vw - 24px));background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:18px 18px 14px;box-shadow:0 24px 60px -20px rgba(0,0,0,.55);pointer-events:auto}
#tourBox h4{font-family:'Fraunces',serif;font-weight:900;font-size:17px;letter-spacing:-.01em}
#tourBox p{font-size:13.5px;line-height:1.5;color:var(--ink-2);margin-top:6px}
.tour-nav{display:flex;align-items:center;gap:8px;margin-top:14px}
.tour-nav .step{font-size:11px;font-weight:800;color:var(--ink-3);letter-spacing:.06em;margin-right:auto}
.tour-nav button{font:inherit;font-weight:700;font-size:13px;padding:9px 14px;border-radius:10px;cursor:pointer;
  border:1.5px solid var(--line);background:var(--paper);color:var(--ink-2)}
.tour-nav button.pri{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.tour-nav button:hover{border-color:var(--amber)}

/* ===== chart card ===== */
/* overflow-x: en la vista de la dueña la gráfica trae más días de los que
   caben en un celular; que scrollee dentro de la tarjeta y no el body */
.chart-card{padding:18px;position:relative;overflow-x:auto}
.meta-tag{position:absolute;top:16px;right:16px;font-size:10px;font-weight:700;color:var(--ink-2);
  background:var(--card);padding:3px 9px;border-radius:99px;border:1px solid var(--line);z-index:3}
.bars{display:flex;align-items:flex-end;gap:8px;height:150px;position:relative;margin-top:26px}
.meta-line{position:absolute;left:0;right:0;border-top:2px dashed var(--ink-3);z-index:1}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;position:relative}
.bar{width:100%;max-width:38px;border-radius:6px 6px 0 0;background:var(--amber);transition:height .5s cubic-bezier(.22,1,.36,1);position:relative;z-index:2}
.bar.hit{background:var(--good)}
.bar.zero{background:var(--line)}
.bar .v{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;color:var(--ink-2)}
.bar-col .d{font-size:10px;font-weight:700;color:var(--ink-3);margin-top:7px;text-transform:uppercase;white-space:nowrap}
.bar-col.today .d{color:var(--amber)}

/* ===== funnel ===== */
.funnel{padding:18px;display:flex;flex-direction:column;gap:12px}
.f-row{display:grid;grid-template-columns:118px 1fr 76px;align-items:center;gap:10px;font-size:12px}
.f-row .n{font-weight:600;color:var(--ink-2)}
.f-row .bar-h{height:22px;border-radius:0 6px 6px 0;background:var(--amber);min-width:4px;transition:width .5s}
.f-row .val{font-weight:800;font-size:14px;text-align:right;white-space:nowrap}
.f-row .pct{color:var(--ink-3);font-weight:600;font-size:11px}

/* ===== prospect list ===== */
.plist{padding:8px 18px;list-style:none}
.plist li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px;font-weight:600}
.plist li:last-child{border:0}
.plist .num{width:26px;height:26px;border-radius:8px;background:var(--amber-soft);color:var(--amber);
  display:grid;place-items:center;font-size:12px;font-weight:800;flex:0 0 auto}
.plist input{border:0;background:transparent;font:inherit;color:var(--ink);width:100%;outline:none}
.plist input::placeholder{color:var(--ink-3);font-weight:400}
.plist .rm{border:0;background:transparent;color:var(--ink-3);font-size:16px;cursor:pointer;flex:0 0 auto}
.plist .rm:hover{color:var(--bad)}

/* ===== grupo de contadores (prospección / alta productividad) ===== */

/* ===== pipeline / cierres en el horno (mobile-first: apilado, grid solo desde tablet) ===== */
.pipe-row{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.pipe-row:last-child{border:0}
.pipe-row input[data-pf="prospecto"]{grid-column:1/-1}
.pipe-row input,.pipe-row select{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--paper);color:var(--ink);width:100%;outline:none}
.pipe-row input:focus,.pipe-row select:focus{border-color:var(--amber)}
.pipe-row .rm{justify-self:end;align-self:center;border:0;background:transparent;color:var(--ink-3);font-size:18px;cursor:pointer;padding:4px 8px}
.pipe-row .rm:hover{color:var(--bad)}
@media(min-width:760px){
  .pipe-row{grid-template-columns:1.4fr .8fr 1.2fr 1fr 28px;align-items:center;padding:10px 18px}
  .pipe-row input[data-pf="prospecto"]{grid-column:auto}
  .pipe-row input,.pipe-row select{font-size:12.5px;padding:7px 8px}
  .pipe-row .rm{justify-self:auto;font-size:16px}
}
/* fila de solo lectura (resumen de la dueña): tarjeta apilada en mobile, tabla desde tablet */
.pipe-row.ro{display:flex;flex-direction:column;gap:6px;padding:14px 18px;font-size:13px}
.pipe-row.ro span{display:flex;justify-content:space-between;gap:10px;font-weight:600}
.pipe-row.ro .mlbl{color:var(--ink-3);font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.05em;flex:0 0 auto}
.pipe-row.ro .ag{color:var(--ink-2);font-weight:700}
.pipe-row.ro .m{font-weight:800}
.pipe-head{display:none}
@media(min-width:760px){

<body>
<div class="wrap">
  <header>
    <div class="brand"><em>25</em> Puntos<small>Leyva Asesores</small></div>
    <div class="hdr-right">
      <div class="today-pill"><span class="dot"></span><span id="hdrFecha"></span><small id="hdrSemana"></small></div>
      <button id="btnTour" class="logout-btn" style="display:none">? Cómo funciona</button>
      <button id="btnLogout" class="logout-btn" style="display:none">Cerrar sesión</button>
    </div>
  </header>
  <main id="app"></main>
  <p class="footnote">Demo personalizada para <b>Leyva Asesores</b> · desarrollado por <b>Ámbar Rojo Studios</b><br>
  Puntaje: llamada 1 · cita 2 · cuestionario 2 · cierre 3 · solicitud 5 · referido 3</p>
</div>

<div id="tour" hidden><div id="tourHole"></div><div id="tourBox"></div></div>

<script>
/* ================== datos demo ================== */
// sol (solicitudes) ya no es un contador simple: es una lista de montos
// capturados por el agente, ver `solicitudes` más abajo.
const PTS = { refObt:3, llam:1, citaObt:2, cuest:2, cierre:3 };
const PTS_SOL = 5;
const META = 25;
// ponytail: tasa fija de comisión sobre el monto capturado — ajustar aquí
// cuando la dueña defina el esquema real por producto/aseguradora (bono, etc).
const COMISION_PCT = 0.30;
const CAMPOS = [
  {k:'refObt',   lbl:'Referidos obtenidos',     pts:3, grupo:'Prospección'},
  {k:'refCont',  lbl:'Referidos contactados',          grupo:'Prospección'},
  {k:'llam',     lbl:'Llamadas realizadas',      pts:1, grupo:'Prospección'},
  {k:'citaObt',  lbl:'Citas obtenidas',          pts:2, grupo:'Prospección'},
  {k:'citasTot', lbl:'Citas del día (total)',           grupo:'Alta productividad'},
  {k:'citasNvas',lbl:'Citas nuevas',                    grupo:'Alta productividad'},
  {k:'cuestPlan',lbl:'Cuestionarios planeados',         grupo:'Alta productividad'},
  {k:'cuest',    lbl:'Cuestionarios realizados', pts:2, grupo:'Alta productividad'},
  {k:'cierrePlan',lbl:'Cierres planeados',              grupo:'Alta productividad'},
  {k:'cierre',   lbl:'Cierres realizados',       pts:3, grupo:'Alta productividad'},
];
const ETAPAS = ['Cita agendada','Cuestionario','Entrevista de cierre','Esperando firma'];
// las 4 listas de 5 que trae el formato de Excel en sus primeras filas
const LISTAS = [
  {k:'pros',  sub:'Prospección',   tit:'Mis 5 mejores prospectos',   ph:'Nombre del prospecto…'},
  {k:'venta', sub:'Esta semana',   tit:'Oportunidades de venta',     ph:'A quién le puedo vender…'},
  {k:'serv',  sub:'Esta semana',   tit:'Oportunidades de servicio',  ph:'A quién le doy seguimiento…'},
  {k:'desa',  sub:'Esta semana',   tit:'Desarrollo personal',        ph:'Qué voy a mejorar…'},
];
const AGENTES = [
  {id:'ana',  nombre:'Ana Torres',    color:'#B45309'},
  {id:'luis', nombre:'Luis Mendoza',  color:'#7C2D12'},
  {id:'caro', nombre:'Carolina Ruiz', color:'#B91C1C'},
  {id:'jose', nombre:'José Aguilar',  color:'#4D7C0F'},
  {id:'mari', nombre:'María Salas',   color:'#0F766E'},
  {id:'julio',nombre:'Julio Domínguez',color:'#1D4ED8'},
  {id:'invit',nombre:'Agente Invitado', color:'#6D28D9'},
  {id:'martha',nombre:'Martha Blanco',  color:'#BE185D'},
];
const hoy = new Date(); hoy.setHours(0,0,0,0);
const iso = d => d.toISOString().slice(0,10);
const F_HOY = iso(hoy);
// día que se está capturando: normalmente hoy, pero el agente puede irse a un
// día anterior que se le haya pasado (queda sellado como modificado).
let diaSel = F_HOY;
const DIAS = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const fechaCorta = f => new Date(f+'T00:00:00').toLocaleDateString('es-MX',{day:'numeric',month:'long'});

// ponytail: estado vive en el servidor (server.js) para que Agente y Dueña
// vean lo mismo en vivo; aquí solo se guarda una copia local para pintar.
let DB = { reg:{}, pros:{}, pipe:{} };
async function postJSON(url, body){
  try { await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); }
  catch(e){ console.error('no se pudo sincronizar', e); }
}
function diaDe(aid){
  if(!DB.reg[aid]) DB.reg[aid] = {};
  if(!DB.reg[aid][diaSel]) DB.reg[aid][diaSel] = blank();
  const r = DB.reg[aid][diaSel];
  if (!Array.isArray(r.solicitudes)) r.solicitudes = [];   // registros viejos (seed) sin este campo
  return r;
}
function pipeDe(aid){ return DB.pipe[aid] || (DB.pipe[aid] = []); }
function refDe(aid){ return DB.ref[aid] || (DB.ref[aid] = []); }
function perfilDe(aid){ return DB.perfil[aid] || (DB.perfil[aid] = {}); }

const FUENTES = ['Por cliente','Por reunión o plática','Volanteo',
                 'Centros de influencia','Redes sociales'];
const OTRA = 'Otros (escribir)';
const ESTADOS_REF = ['Por contactar','Contactado','Cita agendada','Cerrado','Descartado'];

// avatar: foto si la subió, iniciales si no
function avHTML(a, cls='av'){
  const f = perfilDe(a.id).foto;
  return f ? `<span class="${cls} foto" style="background-image:url('${f}')"></span>`
           : `<span class="${cls}" style="background:${a.color}">${inic(a.nombre)}</span>`;
}

/* mes en curso: puntos y prima acumulados, para las metas mensuales */
function mesDe(aid){
  const y = hoy.getFullYear(), m = hoy.getMonth();
  let pts = 0, prima = 0;
  for (const [f, r] of Object.entries(DB.reg[aid] || {})){
    const d = new Date(f + 'T00:00:00');
    if (d.getFullYear() === y && d.getMonth() === m){ pts += puntos(r); prima += montoSol(r); }
  }
  return {pts, prima};
}
function listaDe(aid, k){
  if (!DB.pros[aid] || Array.isArray(DB.pros[aid])) DB.pros[aid] = {pros: DB.pros[aid] || undefined};  // datos viejos: era un solo array
  return DB.pros[aid][k] || (DB.pros[aid][k] = ['','','','','']);
}

// solicitudes: lista de montos que captura el agente (compatible con datos
// viejos de la demo, que traían `sol` como contador y `comision` fija).
const solList = r => Array.isArray(r?.solicitudes) ? r.solicitudes : null;
const solCount = r => solList(r) ? solList(r).length : (r?.sol||0);
const montoSol = r => solList(r) ? solList(r).reduce((s,v)=>s+(+v||0),0) : 0;
const comisionEst = r => solList(r) ? montoSol(r)*COMISION_PCT : (r?.comision||0);

const puntos = r => !r ? 0 : Object.entries(PTS).reduce((s,[k,v]) => s + (r[k]||0)*v, 0) + solCount(r)*PTS_SOL;
const reg = (aid,f) => DB.reg[aid]?.[f] ?? null;
const blank = () => { const o = Object.fromEntries(CAMPOS.map(c=>[c.k,0])); o.solicitudes = []; return o; };
const money = n => '$'+Math.round(n).toLocaleString('es-MX');
const inic = n => n.split(' ').map(p=>p[0]).join('');

function rango(n){         /* últimos n días [{d,f}] */
  const out=[];
  for (let i=n-1;i>=0;i--){ const d = new Date(hoy); d.setDate(d.getDate()-i); out.push({d, f:iso(d)}); }
  return out;
}
const semana = aid => rango(7).map(x => ({...x, r:reg(aid,x.f), pts:puntos(reg(aid,x.f))}));

function racha(aid){       /* días hábiles consecutivos cumpliendo meta, hacia atrás */
  let n=0;
  for (let i=0;i<30;i++){
    const d = new Date(hoy); d.setDate(d.getDate()-i);
    if (d.getDay()===0) continue;
    const p = puntos(reg(aid,iso(d)));
    if (p>=META) n++;
    else if (i===0) continue;      // hoy aún no termina, no rompe racha
    else break;
  }
  return n;
}

/* ================== login ==================
   las contraseñas viven en el servidor (`/api/login`) para que el agente pueda
   cambiar la suya desde su perfil. Sigue sin ser seguridad real: no hay hash ni
   sesión firmada, la sesión es solo un objeto en localStorage. */
const SESSION_KEY = 'sesion25pts_v1';
const getSesion = () => { try { return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); } catch(e){ return null; } };
const setSesion = (user, s) => localStorage.setItem(SESSION_KEY, JSON.stringify({user, ...s}));
let sesion = null;

function loginHTML(err){
  return `<div class="login-wrap"><form class="card login-card" id="loginForm">
    <h2>Iniciar sesión</h2>
    <p style="margin:-8px 0 0;font-size:12px;color:var(--ink-3);font-weight:600">Leyva Asesores · Panel 25 Puntos</p>
    <label>Usuario<input name="user" autocomplete="username" required></label>
    <label>Contraseña<input name="pass" type="password" autocomplete="current-password" required></label>
    ${err?'<p class="login-err">Usuario o contraseña incorrectos.</p>':''}
    <button type="submit">Entrar</button>
  </form></div>`;
}

function mostrarLogin(err){
  $('#app').innerHTML = loginHTML(err);
  $('#btnLogout').style.display = 'none';
  document.getElementById('loginForm').onsubmit = async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const user = fd.get('user').trim().toLowerCase(), pass = fd.get('pass');
    try {
      const r = await fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({user, pass})});
      if (!r.ok) return mostrarLogin(true);
      const s = await r.json();
      setSesion(s.user, {rol:s.rol, ag:s.ag});
      iniciarApp();
    } catch(err){ mostrarLogin(true); }
  };
}

/* ================== estado / router ================== */
let vista = 'agente', agenteSel = 'ana';
let secAgente = 'main';        // pestaña activa del agente: main | ref | perfil
const $ = s => document.querySelector(s);
const fechaLarga = hoy.toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'});
$('#hdrFecha').textContent = fechaLarga.charAt(0).toUpperCase()+fechaLarga.slice(1);
$('#hdrSemana').textContent = '· Semana '+getWeek(hoy);
function getWeek(d){ const s=new Date(d.getFullYear(),0,1); return Math.ceil(((d-s)/864e5 + s.getDay()+1)/7); }

function render(){
  $('#app').innerHTML = vista==='agente' ? vAgente() : vDuena();
  bind();
}

/* ================== vista agente ================== */
function heroAgenteHTML(a, p){
  const faltan = Math.max(0, META-p);
  const sugerencia = faltan<=0 ? '' :
    faltan>=5 ? `<b>1 solicitud</b> (5 pts) o <b>${Math.ceil(faltan/2)} citas</b> te acercan.` :
    faltan>=3 ? `Un <b>cierre</b> (3 pts) y casi la libras.` : `¡<b>${faltan} llamada${faltan>1?'s':''}</b> y la libras!`;
  const fechaHero = diaSel===F_HOY ? fechaLarga
    : new Date(diaSel+'T00:00:00').toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'});
  return `
    <div class="date">${diaSel===F_HOY?'Tu día':'Día capturado'} · ${fechaHero}</div>
    <div class="hero-row">
      <div class="big-pts"><span id="hPts">${p}</span><span>/${META} pts</span></div>
      <div class="hero-msg" id="hMsg">${p>=META
        ? `¡Meta cumplida, ${a.nombre.split(' ')[0]}! Todo lo de hoy ya es ventaja.`
        : `Te faltan <b>${faltan} puntos</b>. ${sugerencia}`}</div>
    </div>
    <div class="track"><div class="fill ${p>=META?'done':''}" id="hFill" style="width:${Math.min(100,p/META*100)}%"></div></div>
    <div class="track-lbl"><span>0</span><span>Meta: ${META} pts</span></div>
    <span class="badge-done ${p>=META?'':'hidden'}" id="hBadge">✓ Día cumplido</span>`;
}

function chartSemanaHTML(sem){
  const max = Math.max(META*1.4,...sem.map(y=>y.pts));
  return `
    <span class="meta-tag">meta ${META}</span>
    <div class="bars">
      <div class="meta-line" style="bottom:${META/max*100}%"></div>
      ${sem.map(x=>`<div class="bar-col ${x.f===F_HOY?'today':''}">
        <div class="bar ${x.pts>=META?'hit':''} ${x.pts===0?'zero':''}" style="height:${Math.max(x.pts/max*100,2)}%">
          ${x.pts>0?`<span class="v">${x.pts}</span>`:''}</div>
        <span class="d">${DIAS[x.d.getDay()]} ${x.d.getDate()}</span></div>`).join('')}
    </div>`;
}

function funnelHTML(fd){
  const fMax = Math.max(1,...fd.map(x=>x[1]));
  return fd.map(([n,v],i)=>`
    <div class="f-row"><span class="n">${n}</span>
      <div><div class="bar-h" style="width:${v/fMax*100}%"></div></div>
      <span class="val">${v} ${i>0&&fd[0][1]>0?`<span class="pct">${Math.round(v/fd[0][1]*100)}%</span>`:''}</span>
    </div>`).join('');
}

function datosAgente(aid){
  const sem = semana(aid);
  const tot = k => sem.reduce((s,d)=>s+(d.r?.[k]||0),0);
  const totSol = sem.reduce((s,d)=>s+solCount(d.r),0);
  return { sem, tot,
    funnel: [['Llamadas',tot('llam')],['Citas obtenidas',tot('citaObt')],['Cuestionarios',tot('cuest')],['Cierres',tot('cierre')],['Solicitudes',totSol]] };
}

function counterHTML(c,r){
  const n = r[c.k]||0;
  return `<div class="card counter">
    <div class="lbl">${c.lbl}${c.pts?`<b>+${c.pts} pt${c.pts>1?'s':''}</b>`:''}</div>
    <div class="ctr-row">
      <span class="val" id="v-${c.k}">${n}</span>
      ${c.pts?`<span class="ctr-earn" id="e-${c.k}">${n?`${n*c.pts} pts`:''}</span>`:''}
    </div>
    <div class="ctr-btns">
      <button class="ctr-btn" data-k="${c.k}" data-d="-1">−</button>
      <button class="ctr-btn" data-k="${c.k}" data-d="1">+</button>
    </div>
  </div>`;
}
// los contadores que dan puntos van primero y visibles; los de seguimiento
// (que no suman) quedan plegados para que el agente no vea 10 cajas iguales.
function gruposHTML(r){
  return `<div class="counters">${CAMPOS.filter(c=>c.pts).map(c=>counterHTML(c,r)).join('')}</div>`;

/* ================== vista dueña ================== */
function vDuena(){
  const dias14 = rango(30);
  const rows = AGENTES.map(a=>{
    const r = reg(a.id,F_HOY);
    const p = puntos(r);
    const sem = semana(a.id);
    return {a, r, p, rch:racha(a.id),
      semPts: sem.reduce((s,d)=>s+d.pts,0),
      com: sem.reduce((s,d)=>s+comisionEst(d.r),0),
      sol: sem.reduce((s,d)=>s+solCount(d.r),0),
      diasOk: sem.filter(d=>d.pts>=META).length};
  });
  const cumplen = rows.filter(x=>x.p>=META).length;
  const sinCap = rows.filter(x=>!x.r);
  const comTot = rows.reduce((s,x)=>s+x.com,0);
  const solTot = rows.reduce((s,x)=>s+x.sol,0);
  const semPtsTot = rows.reduce((s,x)=>s+x.semPts,0);
  const promAg = Math.round(semPtsTot/AGENTES.length);
  const cumplSem = Math.round(rows.reduce((s,x)=>s+x.diasOk,0)/(AGENTES.length*6)*100);
  const rank = [...rows].sort((x,y)=>y.semPts-x.semPts);
  const rMax = Math.max(1,...rank.map(x=>x.semPts));
  const pipeTot = AGENTES.reduce((s,a)=>s+(DB.pipe[a.id]||[]).reduce((t,x)=>t+(+x.monto||0),0),0);
  const est = x => !x.r ? ['z','— Sin capturar'] : x.p>=META ? ['g','✓ Cumplió'] : x.p>=15 ? ['w','◐ En camino'] : ['b','✗ Atrasado'];

  /* tendencia equipo: pts totales por día hábil (14 días) */
  const habiles = dias14.filter(x=>x.d.getDay()!==0);
  const tend = habiles.map(x=>({...x, pts: AGENTES.reduce((s,a)=>s+puntos(reg(a.id,x.f)),0)}));
  const tMax = Math.max(META*AGENTES.length*1.15,...tend.map(x=>x.pts));
  const metaEq = META*AGENTES.length;

  /* embudo equipo semanal */
  const totEq = k => rows.reduce((s,x)=>s+semana(x.a.id).reduce((t,d)=>t+(d.r?.[k]||0),0),0);
  const solEq = rows.reduce((s,x)=>s+x.sol,0);
  const funnelEq = [['Llamadas',totEq('llam')],['Citas obtenidas',totEq('citaObt')],['Cuestionarios',totEq('cuest')],['Cierres',totEq('cierre')],['Solicitudes',solEq]];
  const conv = (a,b) => b>0 ? Math.round(a/b*100) : 0;

  /* áreas de mejora: el eslabón del embudo donde cada agente está más abajo
     que el equipo. El Excel las llama "áreas de prospección / alta productividad". */
  const totsAg = aid => { const sem = semana(aid); const t = k => sem.reduce((s,d)=>s+(d.r?.[k]||0),0);
    return {llam:t('llam'), citaObt:t('citaObt'), cuest:t('cuest'), cierre:t('cierre'),
            sol:sem.reduce((s,d)=>s+solCount(d.r),0)}; };
  const porAg = Object.fromEntries(AGENTES.map(a=>[a.id, totsAg(a.id)]));
  const ESLABONES = [
    {lbl:'Contacto efectivo', num:'citaObt', den:'llam',    uni:['citas','llamadas'], sng:['cita','llamada'],
     tip:'Marca bastante pero saca pocas citas — revisar el guion de la llamada y a quién le está marcando.'},
    {lbl:'Cuestionario',      num:'cuest',   den:'citaObt', uni:['cuestionarios','citas'], sng:['cuestionario','cita'],
     tip:'Consigue citas pero no levanta el cuestionario — practicar la transición de la cita a la entrevista.'},
    {lbl:'Cierre',            num:'cierre',  den:'cuest',   uni:['cierres','cuestionarios'], sng:['cierre','cuestionario'],
     tip:'Llega al cuestionario pero no cierra — vale la pena acompañar una entrevista de cierre.'},
    // solicitudes sobre cuestionarios, no sobre cierres: una solicitud puede
    // entrar sin cierre registrado y el porcentaje se pasaba de 100%.
    {lbl:'Solicitud',         num:'sol',     den:'cuest',   uni:['solicitudes','cuestionarios'], sng:['solicitud','cuestionario'],
     tip:'Trabaja al prospecto pero no aterriza la solicitud — revisar objeciones de precio y formas de pago.'},
  ];
  const ratioEq = e => { const n = AGENTES.reduce((s,a)=>s+porAg[a.id][e.num],0),
                               d = AGENTES.reduce((s,a)=>s+porAg[a.id][e.den],0); return d>0 ? n/d : 0; };
  const llamProm = AGENTES.reduce((s,a)=>s+porAg[a.id].llam,0)/AGENTES.length;
  function areaDe(aid){
    const t = porAg[aid];
    // agente que apenas entra: no hay semana que comparar, y señalarle un área
    // delante de la dueña con dos días de datos sería injusto.
    if (semana(aid).filter(d=>d.r).length < 2) return {tipo:'nuevo', t};
    let peor = null;
    for (const e of ESLABONES){
      if (t[e.den] < 3) continue;                     // sin volumen no se saca conclusión
      const req = ratioEq(e); if (!req) continue;
      const mio = t[e.num]/t[e.den];
      const brecha = mio/req;
      if (brecha < .85 && (!peor || brecha < peor.brecha)) peor = {e, mio, req, brecha, t};
    }
    if (peor) return {tipo:'eslabon', ...peor};
    if (t.llam < llamProm*.7) return {tipo:'volumen', t};
    return {tipo:'ok', t};
  }
  const areas = AGENTES.map(a=>({a, ar:areaDe(a.id)}));

  /* alertas */
  const alertas = [];
  for (const x of sinCap) alertas.push(['b','📵',`<b>${x.a.nombre}</b> no ha capturado actividad hoy. <span class="auto">WHATSAPP 8 PM</span>`]);
  for (const x of rows) if (x.r && x.p<15) alertas.push(['w','⚠️',`<b>${x.a.nombre}</b> va atrasado hoy: ${x.p}/${META} pts.`]);
  for (const x of rows) if (x.diasOk<=1) alertas.push(['w','📉',`<b>${x.a.nombre}</b> solo cumplió meta ${x.diasOk} de 6 días esta semana — candidato a sesión de coaching.`]);

/* pipeline agregado: todos los posibles cierres de todo el equipo, solo lectura */
function pipelineEqHTML(){
  const filas = [];
  AGENTES.forEach(a => (DB.pipe[a.id]||[]).forEach(x => filas.push({...x, agente:a.nombre.split(' ')[0]})));
  filas.sort((x,y)=>(y.monto||0)-(x.monto||0));
  const total = filas.reduce((s,x)=>s+(+x.monto||0),0);
  return `
  <h2><small>Prospección futura</small>Cierres en el horno · equipo</h2>
  <div class="card" style="margin-bottom:8px">
    ${filas.length===0?'<p class="pipe-empty">Nadie tiene posibles cierres capturados todavía.</p>':`
    <div class="pipe-head"><span>Agente</span><span>Prospecto</span><span>Monto</span><span>Etapa</span><span>Fecha esp.</span><span>Comisión si cierra</span></div>
    ${filas.map(x=>`<div class="pipe-row ro">
      <span class="ag"><b class="mlbl">Agente</b>${x.agente}</span>
      <span><b class="mlbl">Prospecto</b>${x.prospecto||'—'}</span>
      <span class="m"><b class="mlbl">Monto</b>${x.monto?money(+x.monto):'—'}</span>
      <span><b class="mlbl">Etapa</b>${x.etapa||'—'}</span>
      <span><b class="mlbl">Fecha esp.</b>${x.fecha||'—'}</span>
      <span class="m"><b class="mlbl">Comisión si cierra</b>${x.monto?money(+x.monto*COMISION_PCT):'—'}</span>
    </div>`).join('')}`}
  </div>
  <p style="font-size:12px;color:var(--ink-2);font-weight:600">
    💰 Total en pipeline: <b style="color:var(--ink)">${money(total)}</b> ·
    posible comisión si cierra todo: <b style="color:var(--ink)">${money(total*COMISION_PCT)}</b></p>`;
}

/* ================== interacción ================== */
function bind(){
  document.querySelectorAll('[data-ag]').forEach(b => b.onclick = () => { agenteSel=b.dataset.ag; render(); });
  document.querySelectorAll('[data-sec]').forEach(b => b.onclick = () => {
    secAgente = b.dataset.sec; render(); window.scrollTo(0,0);
  });
  bindReferidos();
  bindPerfil();
  const inDia = document.getElementById('inDia');
  if (inDia) inDia.onchange = () => {
    if (inDia.value && inDia.value <= F_HOY) { diaSel = inDia.value; render(); }
    else inDia.value = diaSel;                       // no se capturan días futuros
  };
  const btnHoy = document.getElementById('btnHoy');
  if (btnHoy) btnHoy.onclick = () => { diaSel = F_HOY; render(); };
  const extra = document.querySelector('.extra');
  if (extra) extra.ontoggle = () => { extraAbierto = extra.open; };
  // la dueña ve el detalle en su propio panel; no salta al panel de un agente (login separa los roles)
  document.querySelectorAll('.ctr-btn').forEach(b => b.onclick = () => {
    const k=b.dataset.k, d=+b.dataset.d;
    const r=diaDe(agenteSel);
    r[k]=Math.max(0,(r[k]||0)+d);
    document.getElementById('v-'+k).textContent = r[k];   // solo el número
    const earn = document.getElementById('e-'+k);         // "N pts" de ese contador
    if (earn) earn.textContent = r[k] ? `${r[k]*PTS[k]} pts` : '';
    refreshAgente();                                       // hero + gráficas en sitio
    postJSON('/api/set', {agente:agenteSel, dia:diaSel, campo:k, value:r[k]});
  });
  document.querySelectorAll('input[data-k]').forEach(i => i.onchange = () => {
    const r=diaDe(agenteSel);
    r[i.dataset.k]=Math.max(0,+i.value||0); refreshAgente();
    postJSON('/api/set', {agente:agenteSel, dia:diaSel, campo:i.dataset.k, value:r[i.dataset.k]});
  });
  document.querySelectorAll('input[data-lista]').forEach(i => i.onchange = () => {
    const k = i.dataset.lista, idx = +i.dataset.i;
    listaDe(agenteSel,k)[idx] = i.value;
    postJSON('/api/pros', {agente:agenteSel, lista:k, index:idx, value:i.value});
  });

  /* solicitudes de hoy (montos) */
  const syncSol = () => {
    const r = diaDe(agenteSel);
    document.getElementById('solA').innerHTML = solicitudesHTML(r.solicitudes);
    refreshAgente();
    postJSON('/api/sol', {agente:agenteSel, dia:diaSel, list:r.solicitudes});
    bind();
  };
  const btnAddSol = document.getElementById('btnAddSol');
  if (btnAddSol) btnAddSol.onclick = () => { diaDe(agenteSel).solicitudes.push(0); syncSol(); };
  document.querySelectorAll('input[data-sol]').forEach(i => i.onchange = () => {
    diaDe(agenteSel).solicitudes[+i.dataset.sol] = Math.max(0,+i.value||0); syncSol();
  });
  document.querySelectorAll('[data-solrm]').forEach(b => b.onclick = () => {
    diaDe(agenteSel).solicitudes.splice(+b.dataset.solrm,1); syncSol();
  });

  /* cierres en el horno (pipeline) */
  const syncPipe = () => {
    const list = pipeDe(agenteSel);
    document.getElementById('pipeA').innerHTML = pipelineHTML(list);
    postJSON('/api/pipe', {agente:agenteSel, list});
    bind();
  };
  const btnAddPipe = document.getElementById('btnAddPipe');
  if (btnAddPipe) btnAddPipe.onclick = () => { pipeDe(agenteSel).push({prospecto:'',monto:0,etapa:ETAPAS[0],fecha:''}); syncPipe(); };
  document.querySelectorAll('.pipe-row input[data-pf], .pipe-row select[data-pf]').forEach(el => el.onchange = () => {
    const list = pipeDe(agenteSel), i = +el.dataset.pi, f = el.dataset.pf;
    list[i][f] = f==='monto' ? Math.max(0,+el.value||0) : el.value;
    postJSON('/api/pipe', {agente:agenteSel, list});
  });
  document.querySelectorAll('[data-piperm]').forEach(b => b.onclick = () => {
    pipeDe(agenteSel).splice(+b.dataset.piperm,1); syncPipe();
  });
}

/* ================== tour guiado (spotlight) ==================
   ponytail: overlay propio de ~50 líneas en vez de driver.js/intro.js —
   el "hueco" es un box-shadow gigante, no hay que recortar nada. */
const TOUR_KEY = 'tour25pts_v1';
const TOUR = [
  {sel:'#heroA', t:'Tu meta del día', d:'Aquí ves los puntos que llevas hoy y los que te faltan para llegar a 25. La barra se mueve sola cada vez que capturas algo, no hay que darle guardar.'},
  {sel:'#gruposA', t:'Captura con un toque', d:'Estas 5 tarjetas son las que dan puntos. Cada vez que hagas una llamada, saques una cita, un referido, un cuestionario o un cierre, toca el botón grande <b>+</b>. Debajo del número ves los puntos que llevas ganados en cada una.'},
  {sel:'#solA', t:'Lo que más suma: tus solicitudes', d:'Cada solicitud vale <b>+5 puntos</b>. Agrégala y anota el monto de la prima. El monto lo usa la dirección para el reporte; a ti te suma los 5 puntos igual.'},
  {sel:'#extraA', t:'Seguimiento (opcional)', d:'Los datos que <b>no</b> dan puntos —citas del día, planeados— viven aquí plegados para que tu captura de arriba sea rápida. Ábrelo solo cuando lo necesites.'},
  {sel:'#chartA', t:'Tu semana de un vistazo', d:'Los últimos 7 días con tu puntaje: verde es día cumplido. Al lado tienes tu embudo, para ver de cuántas llamadas te sale un cierre.'},
  {sel:'#pipeA', t:'Cierres en el horno', d:'Tus posibles cierres: prospecto, monto, en qué etapa va y para cuándo lo esperas. Así no se te pierde ninguno y la dirección ve lo que viene en camino.'},
  {sel:'#listasA', t:'Tus 4 listas de la semana', d:'Las mismas del formato de papel: tus 5 mejores prospectos, oportunidades de venta, de servicio y tu desarrollo personal. Escríbelas y quedan guardadas.'},
  {sel:'#tabsA', t:'Tus otras secciones', d:'En <b>Referidos</b> llevas tu cartera: quién te lo dio, de dónde viene y en qué va. En <b>Mi perfil</b> pones tu foto, tu teléfono y <b>tus metas del mes</b>. ¡Listo, eso es todo!'},
];
let tourI = -1, tourEl = null;
const tourActivo = () => tourI >= 0;

function tourIr(i){
  const paso = TOUR[i];
  // el tour recorre la sección principal; si estás en Referidos o Mi perfil,
  // vuelve a ella antes de empezar (si no, los selectores no existen).
  if (secAgente !== 'main'){ secAgente = 'main'; render(); }
  const el = document.querySelector(paso.sel);
  if (!el) return tourFin();
  tourI = i; tourEl = el;
  $('#tour').hidden = false;
  $('#tourBox').innerHTML = `<h4>${paso.t}</h4><p>${paso.d}</p>
    <div class="tour-nav"><span class="step">${i+1} / ${TOUR.length}</span>
      <button id="tourSkip">Saltar</button>
      <button id="tourNext" class="pri">${i===TOUR.length-1?'¡Listo!':'Siguiente'}</button>
    </div>`;
  $('#tourNext').onclick = () => i+1 < TOUR.length ? tourIr(i+1) : tourFin();
  $('#tourSkip').onclick = tourFin;
  // centrar el elemento solo si abajo queda sitio para el recuadro; en pantallas
  // bajas conviene subirlo, si no el recuadro cae al fondo y lo tapa a la mitad.
  const centrado = (innerHeight - el.getBoundingClientRect().height)/2 > $('#tourBox').offsetHeight + 26;
  el.scrollIntoView({block: centrado ? 'center' : 'start'});   // instantáneo: medimos justo después
  if (!centrado) scrollBy(0, -80);                             // que no quede bajo el header
  tourPintar();
}

// solo reposiciona (el contenido lo pinta tourIr); se llama también al hacer scroll
function tourPintar(){
  if (!tourEl) return;
  const r = tourEl.getBoundingClientRect(), pad = 8;
  const hole = $('#tourHole'), box = $('#tourBox');
  Object.assign(hole.style, {top:(r.top-pad)+'px', left:(r.left-pad)+'px',
    width:(r.width+pad*2)+'px', height:(r.height+pad*2)+'px'});
  const bh = box.offsetHeight, bw = box.offsetWidth;
  // debajo del hueco si cabe; si no, encima; y si el elemento es tan alto que no
  // cabe de ningún lado (móvil), pegado al fondo — tapa poco y nunca se sale.
  const abajo = r.bottom + 14 + bh < innerHeight, arriba = r.top - 14 - bh > 12;
  box.style.top = (abajo ? r.bottom+14 : arriba ? r.top-14-bh : Math.max(12, innerHeight-bh-12))+'px';
  box.style.left = Math.min(Math.max(12, r.left), innerWidth-bw-12)+'px';
}

function tourFin(){
  tourI = -1; tourEl = null;
  $('#tour').hidden = true;
  localStorage.setItem(TOUR_KEY, '1');
}
addEventListener('scroll', () => { if (tourActivo()) tourPintar(); }, {passive:true});
addEventListener('resize', () => { if (tourActivo()) tourPintar(); });
addEventListener('keydown', e => { if (e.key==='Escape' && tourActivo()) tourFin(); });

function bindReferidos(){
  const sync = (repintar) => {
    const list = refDe(agenteSel);
    postJSON('/api/ref', {agente:agenteSel, list});
    if (repintar) { render(); }
  };
  const btn = document.getElementById('btnAddRef');
  if (btn) btn.onclick = () => {
    refDe(agenteSel).unshift({nombre:'', fuente:FUENTES[0], quien:'', fecha:F_HOY, estado:ESTADOS_REF[0]});
    sync(true);
  };
  document.querySelectorAll('[data-rf]').forEach(el => el.onchange = () => {
    const l = refDe(agenteSel), i = +el.dataset.ri;
    l[i][el.dataset.rf] = el.value;
    // el estado y la fuente cambian los totales de arriba; el texto no
    sync(el.dataset.rf === 'estado' || el.dataset.rf === 'fuente');
  });
  // el select de fuente: si eligen "Otros", deja el campo libre para escribirla
  document.querySelectorAll('[data-fuentesel]').forEach(sel => sel.onchange = () => {
    const l = refDe(agenteSel), i = +sel.dataset.ri;
    l[i].fuente = sel.value === OTRA ? '' : sel.value;
    render();
    if (sel.value === OTRA) document.querySelector(`input[data-rf="fuente"][data-ri="${i}"]`)?.focus();
    postJSON('/api/ref', {agente:agenteSel, list:l});
  });
  document.querySelectorAll('[data-refrm]').forEach(b => b.onclick = () => {
    refDe(agenteSel).splice(+b.dataset.refrm, 1); sync(true);
  });
}

function bindPerfil(){
  document.querySelectorAll('[data-pfc]').forEach(el => el.onchange = () => {
    const campo = el.dataset.pfc;
    const val = (campo==='metaPts'||campo==='metaPrima') ? Math.max(0,+el.value||0) : el.value;
    perfilDe(agenteSel)[campo] = val;
    postJSON('/api/perfil', {agente:agenteSel, campo, value:val});
    if (campo==='metaPts'||campo==='metaPrima') render();   // repinta la barra de avance
  });

  // foto: se reduce a 160px en el cliente para no mandar un JPG de 4 MB al server
  const inFoto = document.getElementById('inFoto');
  if (inFoto) inFoto.onchange = () => {
    const file = inFoto.files[0]; if (!file) return;
    const img = new Image();
    img.onload = () => {
      const L = 160, c = document.createElement('canvas'); c.width = c.height = L;
      const lado = Math.min(img.width, img.height);
      c.getContext('2d').drawImage(img, (img.width-lado)/2, (img.height-lado)/2, lado, lado, 0, 0, L, L);
      const data = c.toDataURL('image/jpeg', .8);
      perfilDe(agenteSel).foto = data;
      postJSON('/api/perfil', {agente:agenteSel, campo:'foto', value:data});
      render();
      URL.revokeObjectURL(img.src);
    };
    img.src = URL.createObjectURL(file);
  };
  const btnQ = document.getElementById('btnQuitarFoto');
  if (btnQ) btnQ.onclick = () => {
    perfilDe(agenteSel).foto = '';
    postJSON('/api/perfil', {agente:agenteSel, campo:'foto', value:''});
    render();
  };

  const form = document.getElementById('formPass');
  if (form) form.onsubmit = async e => {
    e.preventDefault();
    const fd = new FormData(form), msg = document.getElementById('passMsg');
    try {
      const r = await fetch('/api/pass', {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({user:sesion.user, actual:fd.get('actual'), nueva:fd.get('nueva')})});
      const j = await r.json().catch(()=>({}));
      if (r.ok){ msg.className='pf-msg ok'; msg.textContent='Listo, tu contraseña quedó cambiada.'; form.reset(); }
      else if (j.error==='corta'){ msg.className='pf-msg err'; msg.textContent='La nueva contraseña debe tener al menos 6 caracteres.'; }
      else { msg.className='pf-msg err'; msg.textContent='Tu contraseña actual no es correcta.'; }
    } catch(err){ document.getElementById('passMsg').textContent='No se pudo conectar con el servidor.'; }
  };
}

async function cargarEstado(){
  try { DB = await fetch('/api/state').then(r=>r.json());
        DB.pipe ||= {}; DB.pros ||= {}; DB.ref ||= {}; DB.perfil ||= {}; }
  catch(e){ console.error('sin conexión al servidor', e); }
}

async function iniciarApp(){
  sesion = getSesion();
  vista = sesion.rol;
  if (sesion.rol==='agente' && sesion.ag) agenteSel = sesion.ag;
  const btnOut = $('#btnLogout');
  btnOut.style.display = '';
  btnOut.onclick = () => { localStorage.removeItem(SESSION_KEY); location.reload(); };
  await cargarEstado();
  render();
  if (vista === 'agente') {                       // el tour explica la vista del agente
    const btnT = $('#btnTour');
    btnT.style.display = '';
    btnT.onclick = () => tourIr(0);
    if (!localStorage.getItem(TOUR_KEY)) tourIr(0);   // la primera vez arranca solo
  }
  setInterval(async () => {
    if (tourActivo()) return;                                                       // el repintado rompería el spotlight
    if (document.activeElement && document.activeElement.tagName==='INPUT') return; // no interrumpir mientras escribe
    const antes = JSON.stringify(DB);
    await cargarEstado();
    if (JSON.stringify(DB) !== antes) {            // solo repinta si de verdad cambió algo
      const y = window.scrollY;
      render();
      window.scrollTo(0, y);                       // no perder el lugar donde estaba viendo
    }
  }, 2000);
}

sesion = getSesion();
if (sesion && sesion.rol) iniciarApp();
else mostrarLogin(false);
</script>
