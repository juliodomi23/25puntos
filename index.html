<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel 25 Puntos — Leyva Asesores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF6EF; --card:#FFFDF8; --ink:#2A2118; --ink-2:#6B5D4D; --ink-3:#A6987F;
  --line:#E8DFCE; --amber:#B45309; --amber-soft:#F5E3C8; --red:#B91C1C;
  --good:#2E7D32; --good-soft:#E3EFE1; --warn:#B45309; --warn-soft:#F5E3C8;
  --bad:#B91C1C; --bad-soft:#F6E0DC; --gray-soft:#EFEAE0;
  --radius:16px; --shadow:0 1px 2px rgba(42,33,24,.06),0 8px 24px -12px rgba(42,33,24,.18);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:'Sora',system-ui,sans-serif;background:var(--paper);color:var(--ink);
  background-image:radial-gradient(circle at 15% -5%,rgba(180,83,9,.05),transparent 45%),
  radial-gradient(circle at 90% 5%,rgba(185,28,28,.04),transparent 40%);min-height:100vh}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px 96px}
@media(min-width:900px){.wrap{padding:0 32px 96px}}

/* ===== header ===== */
header{display:flex;align-items:center;justify-content:space-between;padding:20px 0 4px;gap:12px;flex-wrap:wrap}
.brand{font-family:'Fraunces',serif;font-weight:900;font-size:22px;letter-spacing:-.02em}
.brand em{font-style:normal;color:var(--amber)}
.brand small{display:block;font-family:'Sora';font-weight:600;font-size:10px;letter-spacing:.18em;color:var(--ink-3);text-transform:uppercase}
.hdr-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.today-pill{background:var(--card);border:1.5px solid var(--line);border-radius:99px;padding:8px 16px;
  font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow)}
.today-pill .dot{width:8px;height:8px;border-radius:50%;background:var(--amber);animation:pulse 2.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.today-pill small{color:var(--ink-3);font-weight:600}
.logout-btn{border:1.5px solid var(--line);background:var(--card);font-family:'Sora';font-weight:700;font-size:12px;
  padding:8px 14px;border-radius:99px;color:var(--ink-2);cursor:pointer}
.logout-btn:hover{border-color:var(--amber);color:var(--amber)}

/* ===== login ===== */
.login-wrap{min-height:60vh;display:flex;align-items:center;justify-content:center;padding:24px 0}
.login-card{width:100%;max-width:340px;padding:28px 26px;display:flex;flex-direction:column;gap:14px}
.login-card h2{margin:0 0 2px}
.login-card label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:var(--ink-2)}
.login-card input{font:inherit;font-size:15px;padding:11px 13px;border-radius:10px;border:1.5px solid var(--line);
  background:var(--paper);color:var(--ink);outline:none}
.login-card input:focus{border-color:var(--amber)}
.login-card button{margin-top:6px;border:0;background:var(--ink);color:var(--paper);font-family:'Sora';font-weight:700;
  font-size:14px;padding:12px;border-radius:10px;cursor:pointer}
.login-err{color:var(--bad);font-size:12px;font-weight:700;margin:-4px 0 0}

/* ===== agent chips ===== */
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--card);
  border-radius:99px;padding:7px 14px 7px 7px;font:inherit;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;transition:all .15s}
.chip .av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff}
.chip.on{border-color:var(--ink);color:var(--ink);box-shadow:var(--shadow)}

/* ===== hero ===== */
.hero{background:var(--ink);color:var(--paper);border-radius:24px;padding:26px 24px 24px;margin-top:14px;
  position:relative;overflow:hidden;box-shadow:0 16px 40px -16px rgba(42,33,24,.45)}
.hero::after{content:"";position:absolute;inset:0;background:
  radial-gradient(circle at 85% 15%,rgba(217,119,6,.35),transparent 55%);pointer-events:none}
@media(min-width:900px){.hero{padding:34px 36px 30px}}
.hero .date{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#C9BBA4;font-weight:600}
.hero-row{display:flex;align-items:flex-end;gap:20px;margin-top:10px;position:relative;z-index:1;flex-wrap:wrap}
.big-pts{font-family:'Fraunces',serif;font-weight:900;font-size:88px;line-height:.85;letter-spacing:-.03em}
@media(min-width:900px){.big-pts{font-size:108px}}
.big-pts span{font-size:26px;font-weight:700;color:#C9BBA4;letter-spacing:0}
.hero-msg{font-size:14px;line-height:1.45;color:#E8DFCE;padding-bottom:8px;max-width:420px}
.hero-msg b{color:#F5C36B}
.track{height:12px;background:rgba(255,255,255,.14);border-radius:99px;margin-top:18px;position:relative;z-index:1}
.track .fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#D97706,#F5C36B);
  transition:width .6s cubic-bezier(.22,1,.36,1);min-width:12px}
.track .fill.done{background:linear-gradient(90deg,#4C9A50,#7FC183)}
.track-lbl{display:flex;justify-content:space-between;font-size:11px;color:#C9BBA4;margin-top:8px;font-weight:600;position:relative;z-index:1}
.badge-done{display:inline-flex;align-items:center;gap:6px;background:rgba(76,154,80,.25);color:#A8D8AB;
  font-size:12px;font-weight:700;padding:5px 12px;border-radius:99px;margin-top:12px;position:relative;z-index:1}
.badge-done.hidden{display:none}

/* ===== layout desktop ===== */
.grid-2{display:grid;grid-template-columns:1fr;gap:0 28px}
@media(min-width:900px){.grid-2{grid-template-columns:1fr 1fr}}
.grid-2 > div{min-width:0}

/* ===== sections ===== */
h2{font-family:'Fraunces',serif;font-weight:700;font-size:19px;margin:30px 0 12px;letter-spacing:-.01em}
h2 small{font-family:'Sora';font-weight:600;font-size:11px;color:var(--ink-3);letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}

/* ===== counters ===== */
.counters{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:560px){.counters{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.counters{grid-template-columns:repeat(5,1fr)}}
.counter{padding:14px;display:flex;flex-direction:column;gap:10px}
.counter .lbl{font-size:12px;font-weight:600;color:var(--ink-2);line-height:1.25;min-height:2.5em}
.counter .lbl b{display:inline-block;background:var(--amber-soft);color:var(--amber);font-size:10px;font-weight:800;
  padding:2px 7px;border-radius:99px;margin-left:2px;white-space:nowrap}
.ctr-row{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.ctr-row .val{font-family:'Fraunces',serif;font-weight:900;font-size:30px;line-height:1}
.ctr-earn{font-size:11px;font-weight:800;color:var(--amber)}
.ctr-btns{display:flex;gap:8px;margin-top:auto}
.ctr-btn{height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--paper);
  font-size:22px;font-weight:700;color:var(--ink);cursor:pointer;transition:all .1s;line-height:1}
.ctr-btn[data-d="-1"]{flex:0 0 46px}
.ctr-btn[data-d="1"]{flex:1;background:var(--ink);border-color:var(--ink);color:var(--paper);font-size:24px}
.ctr-btn:active{transform:scale(.94);background:var(--amber);border-color:var(--amber);color:var(--paper)}
.counter.money .ctr-row input{font-family:'Fraunces',serif;font-weight:900;font-size:24px;width:100%;border:0;
  background:transparent;color:var(--ink);text-align:center;outline:none}

/* ===== bloque de seguimiento (no suma puntos), plegado por defecto ===== */
.extra{margin-top:6px}
.extra>summary{cursor:pointer;list-style:none;font-size:12px;font-weight:800;color:var(--ink-3);
  text-transform:uppercase;letter-spacing:.06em;padding:12px 2px;display:flex;align-items:center;gap:8px}
.extra>summary::-webkit-details-marker{display:none}
.extra>summary::before{content:"▸";font-size:11px;transition:transform .15s}
.extra[open]>summary::before{transform:rotate(90deg)}
.extra .counters{margin-bottom:6px}
/* ===== chart card ===== */
.chart-card{padding:18px;position:relative}
.meta-tag{position:absolute;top:16px;right:16px;font-size:10px;font-weight:700;color:var(--ink-2);
  background:var(--card);padding:3px 9px;border-radius:99px;border:1px solid var(--line);z-index:3}
.bars{display:flex;align-items:flex-end;gap:8px;height:150px;position:relative;margin-top:26px}
.meta-line{position:absolute;left:0;right:0;border-top:2px dashed var(--ink-3);z-index:1}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;position:relative}
.bar{width:100%;max-width:38px;border-radius:6px 6px 0 0;background:var(--amber);transition:height .5s cubic-bezier(.22,1,.36,1);position:relative;z-index:2}
.bar.hit{background:var(--good)}
.bar.zero{background:var(--line)}
.bar .v{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;color:var(--ink-2)}
.bar-col .d{font-size:10px;font-weight:700;color:var(--ink-3);margin-top:7px;text-transform:uppercase;white-space:nowrap}
.bar-col.today .d{color:var(--amber)}

/* ===== funnel ===== */
.funnel{padding:18px;display:flex;flex-direction:column;gap:12px}
.f-row{display:grid;grid-template-columns:118px 1fr 76px;align-items:center;gap:10px;font-size:12px}
.f-row .n{font-weight:600;color:var(--ink-2)}
.f-row .bar-h{height:22px;border-radius:0 6px 6px 0;background:var(--amber);min-width:4px;transition:width .5s}
.f-row .val{font-weight:800;font-size:14px;text-align:right;white-space:nowrap}
.f-row .pct{color:var(--ink-3);font-weight:600;font-size:11px}

/* ===== prospect list ===== */
.plist{padding:8px 18px;list-style:none}
.plist li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px;font-weight:600}
.plist li:last-child{border:0}
.plist .num{width:26px;height:26px;border-radius:8px;background:var(--amber-soft);color:var(--amber);
  display:grid;place-items:center;font-size:12px;font-weight:800;flex:0 0 auto}
.plist input{border:0;background:transparent;font:inherit;color:var(--ink);width:100%;outline:none}
.plist input::placeholder{color:var(--ink-3);font-weight:400}
.plist .rm{border:0;background:transparent;color:var(--ink-3);font-size:16px;cursor:pointer;flex:0 0 auto}
.plist .rm:hover{color:var(--bad)}

/* ===== grupo de contadores (prospección / alta productividad) ===== */

/* ===== pipeline / cierres en el horno (mobile-first: apilado, grid solo desde tablet) ===== */
.pipe-row{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.pipe-row:last-child{border:0}
.pipe-row input[data-pf="prospecto"]{grid-column:1/-1}
.pipe-row input,.pipe-row select{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--paper);color:var(--ink);width:100%;outline:none}
.pipe-row input:focus,.pipe-row select:focus{border-color:var(--amber)}
.pipe-row .rm{justify-self:end;align-self:center;border:0;background:transparent;color:var(--ink-3);font-size:18px;cursor:pointer;padding:4px 8px}
.pipe-row .rm:hover{color:var(--bad)}
@media(min-width:760px){
  .pipe-row{grid-template-columns:1.4fr .8fr 1.2fr 1fr 28px;align-items:center;padding:10px 18px}
  .pipe-row input[data-pf="prospecto"]{grid-column:auto}
  .pipe-row input,.pipe-row select{font-size:12.5px;padding:7px 8px}
  .pipe-row .rm{justify-self:auto;font-size:16px}
}
/* fila de solo lectura (resumen de la dueña): tarjeta apilada en mobile, tabla desde tablet */
.pipe-row.ro{display:flex;flex-direction:column;gap:6px;padding:14px 18px;font-size:13px}
.pipe-row.ro span{display:flex;justify-content:space-between;gap:10px;font-weight:600}
.pipe-row.ro .mlbl{color:var(--ink-3);font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.05em;flex:0 0 auto}
.pipe-row.ro .ag{color:var(--ink-2);font-weight:700}
.pipe-row.ro .m{font-weight:800}
.pipe-head{display:none}
@media(min-width:760px){
  .pipe-row.ro{display:grid;grid-template-columns:1fr 1.2fr .9fr 1.1fr .9fr .9fr;gap:8px;padding:10px 18px;font-size:12.5px}
  .pipe-row.ro span{display:block}
  .pipe-row.ro .mlbl{display:none}
  .pipe-head{display:grid;grid-template-columns:1fr 1.2fr .9fr 1.1fr .9fr .9fr;gap:8px;padding:0 18px 8px;font-size:10px;
    font-weight:800;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
}
.pipe-empty{padding:16px 18px;font-size:13px;color:var(--ink-3)}
.pipe-add{margin:12px 18px 16px;width:calc(100% - 36px);border:1.5px dashed var(--line);background:transparent;
  color:var(--ink-2);font:inherit;font-weight:700;font-size:13px;padding:11px 14px;border-radius:10px;cursor:pointer}
.pipe-add:hover{border-color:var(--amber);color:var(--amber)}

/* ===== owner ===== */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
@media(min-width:760px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{padding:16px 16px 14px}
.tile .k{font-family:'Fraunces',serif;font-weight:900;font-size:30px;letter-spacing:-.02em;white-space:nowrap}
@media(min-width:900px){.tile .k{font-size:36px}}
.tile .k small{font-size:15px;color:var(--ink-3)}
.tile .t{font-size:11px;font-weight:600;color:var(--ink-2);text-transform:uppercase;letter-spacing:.08em;margin-top:2px}
.tile .sub{font-size:11px;color:var(--ink-3);margin-top:4px;font-weight:600}
.team{display:flex;flex-direction:column;gap:10px}
.agent-row{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer;transition:transform .12s}
.agent-row:active{transform:scale(.985)}
.agent-row .av{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;flex:0 0 auto}
.agent-row .info{flex:1;min-width:0}
.agent-row .nm{font-weight:700;font-size:15px}
.agent-row .nm .streak{font-size:11px;font-weight:700;color:var(--good);margin-left:6px}
.agent-row .sub{font-size:12px;color:var(--ink-2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-track{height:6px;background:var(--gray-soft);border-radius:99px;margin-top:7px;overflow:hidden}
.mini-track i{display:block;height:100%;border-radius:99px}
.status{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:4px 10px;border-radius:99px}
.pill.g{background:var(--good-soft);color:var(--good)}
.pill.w{background:var(--warn-soft);color:var(--warn)}
.pill.b{background:var(--bad-soft);color:var(--bad)}
.pill.z{background:var(--gray-soft);color:var(--ink-2)}
.status .pts{font-family:'Fraunces',serif;font-weight:900;font-size:20px}

/* ranking */
.rank{padding:18px;display:flex;flex-direction:column;gap:13px}
.r-row{display:grid;grid-template-columns:24px 108px 1fr 52px;align-items:center;gap:10px;font-size:13px}
.r-row .pos{font-family:'Fraunces',serif;font-weight:900;color:var(--ink-3);font-size:15px}
.r-row .n{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-row .bar-h{height:20px;border-radius:0 6px 6px 0;background:var(--amber);min-width:4px}
.r-row:first-child .bar-h{background:var(--good)}
.r-row .val{font-weight:800;text-align:right}

/* heatmap */
.heat{padding:18px;overflow-x:auto}
.heat table{border-collapse:separate;border-spacing:4px;width:100%;min-width:1150px}
.heat th{font-size:10px;font-weight:700;color:var(--ink-3);text-transform:uppercase;padding:2px 4px;text-align:center}
.heat th.ag{text-align:left;font-size:12px;color:var(--ink);text-transform:none;white-space:nowrap;padding-right:10px}
.heat td{width:34px;height:34px;border-radius:9px;text-align:center;font-size:11px;font-weight:800;vertical-align:middle}
.heat td.g{background:var(--good-soft);color:var(--good)}
.heat td.w{background:var(--warn-soft);color:var(--warn)}
.heat td.b{background:var(--bad-soft);color:var(--bad)}
.heat td.z{background:var(--gray-soft);color:var(--ink-3)}
.heat td.off{background:transparent;color:var(--ink-3)}
.heat td.today-col{outline:2px solid var(--amber);outline-offset:1px}
.heat .legend{display:flex;gap:14px;font-size:11px;font-weight:600;color:var(--ink-2);margin-top:12px;flex-wrap:wrap}
.heat .legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-1px}

/* alertas */
.alerts{padding:8px 18px}
.alerts li{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.45}
.alerts li:last-child{border:0}
.alerts .ico{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:15px;flex:0 0 auto}
.alerts .ico.g{background:var(--good-soft)} .alerts .ico.w{background:var(--warn-soft)} .alerts .ico.b{background:var(--bad-soft)}
.alerts b{font-weight:700}
.alerts .auto{display:inline-block;font-size:10px;font-weight:800;background:var(--ink);color:var(--paper);
  padding:2px 8px;border-radius:99px;margin-left:6px;letter-spacing:.05em;vertical-align:1px}

/* ===== whatsapp mockup ===== */
.wa-grid{display:grid;grid-template-columns:1fr;gap:16px;margin-top:16px}
@media(min-width:760px){.wa-grid{grid-template-columns:1fr 1fr}}
.wa-phone{background:#0B141A;border-radius:20px;padding:10px;box-shadow:var(--shadow)}
.wa-head{display:flex;align-items:center;gap:10px;padding:8px 10px 12px;color:#E9EDEF}
.wa-head .av{width:34px;height:34px;border-radius:50%;background:var(--amber);display:grid;place-items:center;
  font-weight:800;font-size:12px;color:#fff;flex:0 0 auto}
.wa-head .nm{font-size:13px;font-weight:700}
.wa-head .st{font-size:11px;color:#8696A0}
.wa-body{background:#0B141A;background-image:linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);
  background-size:14px 14px;border-radius:12px;padding:14px 10px;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px}
.wa-bub{background:#005C4B;color:#E9EDEF;font-size:13px;line-height:1.5;padding:8px 11px 6px;border-radius:8px 8px 2px 8px;
  max-width:88%;align-self:flex-end;position:relative;box-shadow:0 1px 1px rgba(0,0,0,.3)}
.wa-bub b{color:#F5C36B}
.wa-bub .meta{display:flex;justify-content:flex-end;align-items:center;gap:3px;margin-top:3px}
.wa-bub .time{font-size:10px;color:#8FA89D}
.wa-bub .check{color:#53BDEB;font-size:12px;letter-spacing:-2px}
.wa-cap{font-size:11px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}

.footnote{text-align:center;font-size:11px;color:var(--ink-3);margin-top:36px;line-height:1.6}
.footnote b{color:var(--ink-2)}
.fade-in{animation:fi .4s cubic-bezier(.22,1,.36,1) both}
@keyframes fi{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><em>25</em> Puntos<small>Leyva Asesores</small></div>
    <div class="hdr-right">
      <div class="today-pill"><span class="dot"></span><span id="hdrFecha"></span><small id="hdrSemana"></small></div>
      <button id="btnLogout" class="logout-btn" style="display:none">Cerrar sesión</button>
    </div>
  </header>
  <main id="app"></main>
  <p class="footnote">Demo personalizada para <b>Leyva Asesores</b> · desarrollado por <b>Ámbar Rojo Studios</b><br>
  Puntaje: llamada 1 · cita 2 · cuestionario 2 · cierre 3 · solicitud 5 · referido 3</p>
</div>

<script>
/* ================== datos demo ================== */
// sol (solicitudes) ya no es un contador simple: es una lista de montos
// capturados por el agente, ver `solicitudes` más abajo.
const PTS = { refObt:3, llam:1, citaObt:2, cuest:2, cierre:3 };
const PTS_SOL = 5;
const META = 25;
// ponytail: tasa fija de comisión sobre el monto capturado — ajustar aquí
// cuando la dueña defina el esquema real por producto/aseguradora (bono, etc).
const COMISION_PCT = 0.30;
const CAMPOS = [
  {k:'refObt',   lbl:'Referidos obtenidos',     pts:3, grupo:'Prospección'},
  {k:'refCont',  lbl:'Referidos contactados',          grupo:'Prospección'},
  {k:'llam',     lbl:'Llamadas realizadas',      pts:1, grupo:'Prospección'},
  {k:'citaObt',  lbl:'Citas obtenidas',          pts:2, grupo:'Prospección'},
  {k:'citasTot', lbl:'Citas del día (total)',           grupo:'Alta productividad'},
  {k:'citasNvas',lbl:'Citas nuevas',                    grupo:'Alta productividad'},
  {k:'cuestPlan',lbl:'Cuestionarios planeados',         grupo:'Alta productividad'},
  {k:'cuest',    lbl:'Cuestionarios realizados', pts:2, grupo:'Alta productividad'},
  {k:'cierrePlan',lbl:'Cierres planeados',              grupo:'Alta productividad'},
  {k:'cierre',   lbl:'Cierres realizados',       pts:3, grupo:'Alta productividad'},
];
const ETAPAS = ['Cita agendada','Cuestionario','Entrevista de cierre','Esperando firma'];
const AGENTES = [
  {id:'ana',  nombre:'Ana Torres',    color:'#B45309'},
  {id:'luis', nombre:'Luis Mendoza',  color:'#7C2D12'},
  {id:'caro', nombre:'Carolina Ruiz', color:'#B91C1C'},
  {id:'jose', nombre:'José Aguilar',  color:'#4D7C0F'},
  {id:'mari', nombre:'María Salas',   color:'#0F766E'},
  {id:'julio',nombre:'Julio Domínguez',color:'#1D4ED8'},
];
const hoy = new Date(); hoy.setHours(0,0,0,0);
const iso = d => d.toISOString().slice(0,10);
const F_HOY = iso(hoy);
const DIAS = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];

// ponytail: estado vive en el servidor (server.js) para que Agente y Dueña
// vean lo mismo en vivo; aquí solo se guarda una copia local para pintar.
let DB = { reg:{}, pros:{}, pipe:{} };
async function postJSON(url, body){
  try { await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); }
  catch(e){ console.error('no se pudo sincronizar', e); }
}
function diaDe(aid){
  if(!DB.reg[aid]) DB.reg[aid] = {};
  if(!DB.reg[aid][F_HOY]) DB.reg[aid][F_HOY] = blank();
  const r = DB.reg[aid][F_HOY];
  if (!Array.isArray(r.solicitudes)) r.solicitudes = [];   // registros viejos (seed) sin este campo
  return r;
}
function pipeDe(aid){ return DB.pipe[aid] || (DB.pipe[aid] = []); }

// solicitudes: lista de montos que captura el agente (compatible con datos
// viejos de la demo, que traían `sol` como contador y `comision` fija).
const solList = r => Array.isArray(r?.solicitudes) ? r.solicitudes : null;
const solCount = r => solList(r) ? solList(r).length : (r?.sol||0);
const montoSol = r => solList(r) ? solList(r).reduce((s,v)=>s+(+v||0),0) : 0;
const comisionEst = r => solList(r) ? montoSol(r)*COMISION_PCT : (r?.comision||0);

const puntos = r => !r ? 0 : Object.entries(PTS).reduce((s,[k,v]) => s + (r[k]||0)*v, 0) + solCount(r)*PTS_SOL;
const reg = (aid,f) => DB.reg[aid]?.[f] ?? null;
const blank = () => { const o = Object.fromEntries(CAMPOS.map(c=>[c.k,0])); o.solicitudes = []; return o; };
const money = n => '$'+Math.round(n).toLocaleString('es-MX');
const inic = n => n.split(' ').map(p=>p[0]).join('');

function rango(n){         /* últimos n días [{d,f}] */
  const out=[];
  for (let i=n-1;i>=0;i--){ const d = new Date(hoy); d.setDate(d.getDate()-i); out.push({d, f:iso(d)}); }
  return out;
}
const semana = aid => rango(7).map(x => ({...x, r:reg(aid,x.f), pts:puntos(reg(aid,x.f))}));

function racha(aid){       /* días hábiles consecutivos cumpliendo meta, hacia atrás */
  let n=0;
  for (let i=0;i<30;i++){
    const d = new Date(hoy); d.setDate(d.getDate()-i);
    if (d.getDay()===0) continue;
    const p = puntos(reg(aid,iso(d)));
    if (p>=META) n++;
    else if (i===0) continue;      // hoy aún no termina, no rompe racha
    else break;
  }
  return n;
}

  return `

    <div class="hero-row">
      <div class="big-pts"><span id="hPts">${p}</span><span>/${META} pts</span></div>

}

function chartSemanaHTML(sem){
  const max = Math.max(META*1.4,...sem.map(y=>y.pts));
  return `
    <span class="meta-tag">meta ${META}</span>
    <div class="bars">
      <div class="meta-line" style="bottom:${META/max*100}%"></div>
      ${sem.map(x=>`<div class="bar-col ${x.f===F_HOY?'today':''}">
        <div class="bar ${x.pts>=META?'hit':''} ${x.pts===0?'zero':''}" style="height:${Math.max(x.pts/max*100,2)}%">
          ${x.pts>0?`<span class="v">${x.pts}</span>`:''}</div>
        <span class="d">${DIAS[x.d.getDay()]} ${x.d.getDate()}</span></div>`).join('')}
    </div>`;
}

function funnelHTML(fd){
  const fMax = Math.max(1,...fd.map(x=>x[1]));
  return fd.map(([n,v],i)=>`
    <div class="f-row"><span class="n">${n}</span>
      <div><div class="bar-h" style="width:${v/fMax*100}%"></div></div>
      <span class="val">${v} ${i>0&&fd[0][1]>0?`<span class="pct">${Math.round(v/fd[0][1]*100)}%</span>`:''}</span>
    </div>`).join('');
}

function datosAgente(aid){
  const sem = semana(aid);
  const tot = k => sem.reduce((s,d)=>s+(d.r?.[k]||0),0);
  const totSol = sem.reduce((s,d)=>s+solCount(d.r),0);
  return { sem, tot,
    funnel: [['Llamadas',tot('llam')],['Citas obtenidas',tot('citaObt')],['Cuestionarios',tot('cuest')],['Cierres',tot('cierre')],['Solicitudes',totSol]] };
}

function counterHTML(c,r){
  const n = r[c.k]||0;
  return `<div class="card counter">
    <div class="lbl">${c.lbl}${c.pts?`<b>+${c.pts} pt${c.pts>1?'s':''}</b>`:''}</div>
    <div class="ctr-row">
      <span class="val" id="v-${c.k}">${n}</span>
      ${c.pts?`<span class="ctr-earn" id="e-${c.k}">${n?`${n*c.pts} pts`:''}</span>`:''}
    </div>
    <div class="ctr-btns">
      <button class="ctr-btn" data-k="${c.k}" data-d="-1">−</button>
      <button class="ctr-btn" data-k="${c.k}" data-d="1">+</button>
    </div>
  </div>`;
}

/* ================== vista dueña ================== */
function vDuena(){
  const dias14 = rango(30);
  const rows = AGENTES.map(a=>{
    const r = reg(a.id,F_HOY);
    const p = puntos(r);
    const sem = semana(a.id);
    return {a, r, p, rch:racha(a.id),
      semPts: sem.reduce((s,d)=>s+d.pts,0),
      com: sem.reduce((s,d)=>s+comisionEst(d.r),0),
      sol: sem.reduce((s,d)=>s+solCount(d.r),0),
      diasOk: sem.filter(d=>d.pts>=META).length};
  });
  const cumplen = rows.filter(x=>x.p>=META).length;
  const sinCap = rows.filter(x=>!x.r);
  const comTot = rows.reduce((s,x)=>s+x.com,0);
  const solTot = rows.reduce((s,x)=>s+x.sol,0);
  const semPtsTot = rows.reduce((s,x)=>s+x.semPts,0);
  const promAg = Math.round(semPtsTot/AGENTES.length);
  const cumplSem = Math.round(rows.reduce((s,x)=>s+x.diasOk,0)/(AGENTES.length*6)*100);
  const rank = [...rows].sort((x,y)=>y.semPts-x.semPts);
  const rMax = Math.max(1,...rank.map(x=>x.semPts));
  const pipeTot = AGENTES.reduce((s,a)=>s+(DB.pipe[a.id]||[]).reduce((t,x)=>t+(+x.monto||0),0),0);
  const est = x => !x.r ? ['z','— Sin capturar'] : x.p>=META ? ['g','✓ Cumplió'] : x.p>=15 ? ['w','◐ En camino'] : ['b','✗ Atrasado'];

  /* tendencia equipo: pts totales por día hábil (14 días) */
  const habiles = dias14.filter(x=>x.d.getDay()!==0);
  const tend = habiles.map(x=>({...x, pts: AGENTES.reduce((s,a)=>s+puntos(reg(a.id,x.f)),0)}));
  const tMax = Math.max(META*AGENTES.length*1.15,...tend.map(x=>x.pts));
  const metaEq = META*AGENTES.length;

  /* embudo equipo semanal */
  const totEq = k => rows.reduce((s,x)=>s+semana(x.a.id).reduce((t,d)=>t+(d.r?.[k]||0),0),0);
  const solEq = rows.reduce((s,x)=>s+x.sol,0);
  const funnelEq = [['Llamadas',totEq('llam')],['Citas obtenidas',totEq('citaObt')],['Cuestionarios',totEq('cuest')],['Cierres',totEq('cierre')],['Solicitudes',solEq]];
  const conv = (a,b) => b>0 ? Math.round(a/b*100) : 0;

  /* alertas */
  const alertas = [];
  for (const x of sinCap) alertas.push(['b','📵',`<b>${x.a.nombre}</b> no ha capturado actividad hoy. <span class="auto">WHATSAPP 8 PM</span>`]);
  for (const x of rows) if (x.r && x.p<15) alertas.push(['w','⚠️',`<b>${x.a.nombre}</b> va atrasado hoy: ${x.p}/${META} pts.`]);
  for (const x of rows) if (x.diasOk<=1) alertas.push(['w','📉',`<b>${x.a.nombre}</b> solo cumplió meta ${x.diasOk} de 6 días esta semana — candidato a sesión de coaching.`]);
  for (const x of rows) if (x.rch>=3) alertas.push(['g','🔥',`<b>${x.a.nombre}</b> lleva ${x.rch} días seguidos en meta. Reconócelo en la junta semanal.`]);
  if (!alertas.length) alertas.push(['g','✅','Sin pendientes: todo el equipo al corriente.']);

  /* heatmap */
  const heatCell = (a,x) => {
    if (x.d.getDay()===0) return '<td class="off">·</td>';
    const p = puntos(reg(a.id,x.f));
    const cls = x.f===F_HOY&&!reg(a.id,x.f) ? 'z' : p>=META?'g':p>=15?'w':p>0?'b':'z';
    const tc = x.f===F_HOY?' today-col':'';
    return `<td class="${cls}${tc}" title="${a.nombre} · ${x.d.toLocaleDateString('es-MX',{day:'numeric',month:'short'})} · ${p} pts">${p||'–'}</td>`;
  };

  return `
  <div class="hero">
    <div class="date">Resumen del equipo · ${fechaLarga}</div>
    <div class="hero-row">
      <div class="big-pts">${cumplen}<span>/${AGENTES.length} en meta hoy</span></div>
      <div class="hero-msg">${sinCap.length>0?`<b>${sinCap.map(x=>x.a.nombre.split(' ')[0]).join(', ')} sin capturar hoy</b> — el recordatorio automático de WhatsApp sale a las 8 pm.`:'Todo el equipo ha capturado hoy.'}</div>
    </div>
    <div class="track"><div class="fill ${cumplen===AGENTES.length?'done':''}" style="width:${cumplen/AGENTES.length*100}%"></div></div>
    <div class="track-lbl"><span>0 agentes</span><span>${AGENTES.length} agentes</span></div>
  </div>

  <div class="tiles">
    <div class="card tile"><div class="k">${money(comTot)}</div><div class="t">Comisión est. semana</div>
      <div class="sub">≈ ${money(comTot*4)} proyección mensual</div></div>
    <div class="card tile"><div class="k">${solTot}</div><div class="t">Solicitudes semana</div>
      <div class="sub">${totEq('llam')} llamadas → ${solTot} pólizas</div></div>
    <div class="card tile"><div class="k">${promAg}<small> pts</small></div><div class="t">Promedio por agente</div>
      <div class="sub">meta semanal: ${META*6} pts</div></div>
    <div class="card tile"><div class="k">${cumplSem}<small>%</small></div><div class="t">Cumplimiento semanal</div>
      <div class="sub">días-agente en meta</div></div>
    <div class="card tile"><div class="k">${money(pipeTot)}</div><div class="t">En pipeline (por cerrar)</div>
      <div class="sub">posibles cierres capturados por el equipo</div></div>
  </div>

  <h2><small>Hoy</small>Semáforo del equipo</h2>
  <div class="team">
    ${rows.map(x=>{ const [cls,txt] = est(x);
      return `<div class="card agent-row" data-goag="${x.a.id}">
        <span class="av" style="background:${x.a.color}">${inic(x.a.nombre)}</span>
        <div class="info"><div class="nm">${x.a.nombre}${x.rch>=3?`<span class="streak">🔥 ${x.rch}d</span>`:''}</div>
          <div class="sub">${x.r?`${x.r.llam||0} llamadas · ${x.r.citaObt||0} citas · ${solCount(x.r)} solicitudes · sem: ${x.semPts} pts (${x.diasOk}/6 días en meta)`:'Sin actividad registrada hoy'}</div>
          <div class="mini-track"><i style="width:${Math.min(100,x.p/META*100)}%;background:${
            {g:'var(--good)',w:'var(--warn)',b:'var(--bad)',z:'var(--line)'}[cls]}"></i></div>
        </div>
        <div class="status"><span class="pill ${cls}">${txt}</span><span class="pts">${x.p}<small style="font-size:11px;color:var(--ink-3)"> /${META}</small></span></div>
      </div>`;}).join('')}
  </div>

  <h2><small>Requiere tu atención</small>Alertas y reconocimientos</h2>
  <ul class="card alerts">
    ${alertas.map(([cls,ico,txt])=>`<li><span class="ico ${cls}">${ico}</span><span>${txt}</span></li>`).join('')}
  </ul>

  <h2><small>Automatización incluida</small>Así les llega por WhatsApp</h2>
  <div class="wa-grid">${waMockHTML(rows, sinCap, cumplen, comTot, solTot)}</div>

  <h2><small>Último mes</small>Mapa de cumplimiento</h2>
  <div class="card heat">
    <table>
      <tr><th class="ag"></th>${dias14.map(x=>`<th>${DIAS[x.d.getDay()]}<br>${x.d.getDate()}</th>`).join('')}</tr>
      ${AGENTES.map(a=>`<tr><th class="ag">${a.nombre.split(' ')[0]}</th>${dias14.map(x=>heatCell(a,x)).join('')}</tr>`).join('')}
    </table>
    <div class="legend">
      <span><i style="background:var(--good-soft)"></i>Meta cumplida (≥25)</span>
      <span><i style="background:var(--warn-soft)"></i>En camino (15–24)</span>
      <span><i style="background:var(--bad-soft)"></i>Atrasado (&lt;15)</span>
      <span><i style="background:var(--gray-soft)"></i>Sin captura</span>
    </div>
  </div>

  <div class="grid-2">
    <div>
      <h2><small>Últimos ${habiles.length} días hábiles</small>Tendencia del equipo</h2>
      <div class="card chart-card">
        <span class="meta-tag">meta equipo ${metaEq}</span>
        <div class="bars">
          <div class="meta-line" style="bottom:${metaEq/tMax*100}%"></div>
          ${tend.map(x=>`<div class="bar-col ${x.f===F_HOY?'today':''}">
            <div class="bar ${x.pts>=metaEq?'hit':''} ${x.pts===0?'zero':''}" style="height:${Math.max(x.pts/tMax*100,2)}%">
              <span class="v">${x.pts||''}</span></div>
            <span class="d">${x.d.getDate()}</span></div>`).join('')}
        </div>
      </div>
    </div>
    <div>
      <h2><small>Semana</small>Embudo del equipo</h2>
      <div class="card funnel">${funnelHTML(funnelEq)}</div>
      <p style="font-size:12px;color:var(--ink-2);margin-top:10px;font-weight:600;line-height:1.7">
        Conversión llamada→cita: <b>${conv(totEq('citaObt'),totEq('llam'))}%</b> ·
        cita→cierre: <b>${conv(totEq('cierre'),totEq('citaObt'))}%</b> ·
        cierre→solicitud: <b>${conv(totEq('sol'),totEq('cierre'))}%</b></p>
    </div>
  </div>

  <h2><small>Últimos 7 días</small>Ranking semanal</h2>
  <div class="card rank" style="max-width:640px">
    ${rank.map((x,i)=>`<div class="r-row">
      <span class="pos">${i+1}</span><span class="n">${x.a.nombre}</span>
      <div><div class="bar-h" style="width:${x.semPts/rMax*100}%"></div></div>
      <span class="val">${x.semPts}</span></div>`).join('')}
    <p style="font-size:11px;color:var(--ink-3);margin-top:4px">Puntos acumulados · meta semanal de referencia: ${META*6} pts (6 días)</p>
  </div>

  ${pipelineEqHTML()}`;
}

/* pipeline agregado: todos los posibles cierres de todo el equipo, solo lectura */
function pipelineEqHTML(){
  const filas = [];
  AGENTES.forEach(a => (DB.pipe[a.id]||[]).forEach(x => filas.push({...x, agente:a.nombre.split(' ')[0]})));
  filas.sort((x,y)=>(y.monto||0)-(x.monto||0));
  const total = filas.reduce((s,x)=>s+(+x.monto||0),0);
  return `
  <h2><small>Prospección futura</small>Cierres en el horno · equipo</h2>
  <div class="card" style="margin-bottom:8px">
    ${filas.length===0?'<p class="pipe-empty">Nadie tiene posibles cierres capturados todavía.</p>':`
    <div class="pipe-head"><span>Agente</span><span>Prospecto</span><span>Monto</span><span>Etapa</span><span>Fecha esp.</span><span>Comisión si cierra</span></div>
    ${filas.map(x=>`<div class="pipe-row ro">
      <span class="ag"><b class="mlbl">Agente</b>${x.agente}</span>
      <span><b class="mlbl">Prospecto</b>${x.prospecto||'—'}</span>
      <span class="m"><b class="mlbl">Monto</b>${x.monto?money(+x.monto):'—'}</span>
      <span><b class="mlbl">Etapa</b>${x.etapa||'—'}</span>
      <span><b class="mlbl">Fecha esp.</b>${x.fecha||'—'}</span>
      <span class="m"><b class="mlbl">Comisión si cierra</b>${x.monto?money(+x.monto*COMISION_PCT):'—'}</span>
    </div>`).join('')}`}
  </div>
  <p style="font-size:12px;color:var(--ink-2);font-weight:600">
    💰 Total en pipeline: <b style="color:var(--ink)">${money(total)}</b> ·
    posible comisión si cierra todo: <b style="color:var(--ink)">${money(total*COMISION_PCT)}</b></p>`;
}

/* ================== interacción ================== */
function bind(){
  document.querySelectorAll('[data-ag]').forEach(b => b.onclick = () => { agenteSel=b.dataset.ag; render(); });
  const extra = document.querySelector('.extra');
  if (extra) extra.ontoggle = () => { extraAbierto = extra.open; };
  // la dueña ve el detalle en su propio panel; no salta al panel de un agente (login separa los roles)
  document.querySelectorAll('.ctr-btn').forEach(b => b.onclick = () => {
    const k=b.dataset.k, d=+b.dataset.d;
    const r=diaDe(agenteSel);
    r[k]=Math.max(0,(r[k]||0)+d);
    document.getElementById('v-'+k).textContent = r[k];   // solo el número
    const earn = document.getElementById('e-'+k);         // "N pts" de ese contador
    if (earn) earn.textContent = r[k] ? `${r[k]*PTS[k]} pts` : '';
    refreshAgente();                                       // hero + gráficas en sitio
    postJSON('/api/set', {agente:agenteSel, dia:F_HOY, campo:k, value:r[k]});
  });
  document.querySelectorAll('input[data-k]').forEach(i => i.onchange = () => {
    const r=diaDe(agenteSel);
    r[i.dataset.k]=Math.max(0,+i.value||0); refreshAgente();
    postJSON('/api/set', {agente:agenteSel, dia:F_HOY, campo:i.dataset.k, value:r[i.dataset.k]});
  });
  document.querySelectorAll('input[data-pros]').forEach(i => i.onchange = () => {
    if(!DB.pros[agenteSel]) DB.pros[agenteSel]=['','','','',''];
    DB.pros[agenteSel][+i.dataset.pros]=i.value;
    postJSON('/api/pros', {agente:agenteSel, index:+i.dataset.pros, value:i.value});
  });

  /* solicitudes de hoy (montos) */
  const syncSol = () => {
    const r = diaDe(agenteSel);
    document.getElementById('solA').innerHTML = solicitudesHTML(r.solicitudes);
    refreshAgente();
    postJSON('/api/sol', {agente:agenteSel, dia:F_HOY, list:r.solicitudes});
    bind();
  };
  const btnAddSol = document.getElementById('btnAddSol');
  if (btnAddSol) btnAddSol.onclick = () => { diaDe(agenteSel).solicitudes.push(0); syncSol(); };
  document.querySelectorAll('input[data-sol]').forEach(i => i.onchange = () => {
    diaDe(agenteSel).solicitudes[+i.dataset.sol] = Math.max(0,+i.value||0); syncSol();
  });
  document.querySelectorAll('[data-solrm]').forEach(b => b.onclick = () => {
    diaDe(agenteSel).solicitudes.splice(+b.dataset.solrm,1); syncSol();
  });

  /* cierres en el horno (pipeline) */
  const syncPipe = () => {
    const list = pipeDe(agenteSel);
    document.getElementById('pipeA').innerHTML = pipelineHTML(list);
    postJSON('/api/pipe', {agente:agenteSel, list});
    bind();
  };
  const btnAddPipe = document.getElementById('btnAddPipe');
  if (btnAddPipe) btnAddPipe.onclick = () => { pipeDe(agenteSel).push({prospecto:'',monto:0,etapa:ETAPAS[0],fecha:''}); syncPipe(); };
  document.querySelectorAll('.pipe-row input[data-pf], .pipe-row select[data-pf]').forEach(el => el.onchange = () => {
    const list = pipeDe(agenteSel), i = +el.dataset.pi, f = el.dataset.pf;
    list[i][f] = f==='monto' ? Math.max(0,+el.value||0) : el.value;
    postJSON('/api/pipe', {agente:agenteSel, list});
  });
  document.querySelectorAll('[data-piperm]').forEach(b => b.onclick = () => {
    pipeDe(agenteSel).splice(+b.dataset.piperm,1); syncPipe();
  });
}

async function cargarEstado(){
  try { DB = await fetch('/api/state').then(r=>r.json()); DB.pipe ||= {}; DB.pros ||= {}; }
  catch(e){ console.error('sin conexión al servidor', e); }
}

async function iniciarApp(){
  sesion = getSesion();
  vista = sesion.rol;
  if (sesion.rol==='agente' && sesion.ag) agenteSel = sesion.ag;
  const btnOut = $('#btnLogout');
  btnOut.style.display = '';
  btnOut.onclick = () => { localStorage.removeItem(SESSION_KEY); location.reload(); };
  await cargarEstado();
  render();
  setInterval(async () => {
    if (document.activeElement && document.activeElement.tagName==='INPUT') return; // no interrumpir mientras escribe
    const antes = JSON.stringify(DB);
    await cargarEstado();
    if (JSON.stringify(DB) !== antes) {            // solo repinta si de verdad cambió algo
      const y = window.scrollY;
      render();
      window.scrollTo(0, y);                       // no perder el lugar donde estaba viendo
    }
  }, 2000);
}

sesion = getSesion();
if (sesion && USERS[sesion.user]) iniciarApp();
else mostrarLogin(false);
</script>
